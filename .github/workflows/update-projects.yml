name: Update Profile Content

on:
  schedule:
    # 배포된 글 목록을 6시간마다 확인 (KST 03:17, 09:17, 15:17, 21:17)
    - cron: '17 */6 * * *'
  workflow_dispatch: # 수동 실행도 가능
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-projects.yml'
      - 'scripts/profile-data.js'
      - 'scripts/update-projects.js'
      - 'scripts/update-projects.test.js'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: profile-content
  cancel-in-progress: false

jobs:
  update-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd ${{ github.workspace }}
        npm ci

    - name: Test profile generator
      run: |
        cd ${{ github.workspace }}
        npm test
        
    - name: Update profile content
      run: |
        cd ${{ github.workspace }}
        npm run update:projects
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain README.md README.ko.md)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md README.ko.md
        git commit -m "Update profile content - $(date +'%Y-%m-%d')"
        git push
        
    - name: No changes detected
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: |
        echo "✅ No changes to project list"
