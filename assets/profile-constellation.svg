<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">uiwwsw frontend engineering profile banner</title>
  <desc id="desc">A production trace showing how uiwwsw turns AI-assisted drafts into dependable frontend products through constraints, verification, and release.</desc>

  <rect width="1280" height="640" fill="#0A0C0F"/>
  <rect width="12" height="640" fill="#60D6C2"/>

  <g opacity="0.52" stroke="#242A30" stroke-width="1">
    <path d="M64 0V640"/>
    <path d="M256 0V640"/>
    <path d="M448 0V640"/>
    <path d="M640 0V640"/>
    <path d="M832 0V640"/>
    <path d="M1024 0V640"/>
    <path d="M1216 0V640"/>
    <path d="M0 64H1280"/>
    <path d="M0 192H1280"/>
    <path d="M0 320H1280"/>
    <path d="M0 448H1280"/>
    <path d="M0 576H1280"/>
  </g>

  <g transform="translate(64 52)">
    <text x="0" y="0" fill="#9DA7B2" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="700">UIWWSW / FRONTEND ENGINEERING</text>
    <rect x="0" y="26" width="714" height="2" fill="#2B3239"/>

    <text x="0" y="84" fill="#F4C95D" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700">AI CAN WRITE THE</text>
    <text x="0" y="178" fill="#F5F7F8" font-family="Georgia, Times New Roman, serif" font-size="88" font-weight="700">happy path.</text>

    <text x="0" y="226" fill="#60D6C2" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700">I ENGINEER</text>
    <text x="0" y="310" fill="#F5F7F8" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="700">what happens next.</text>

    <text x="0" y="366" fill="#C2CAD2" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22">The constraints, fallbacks, test states, and release paths</text>
    <text x="0" y="398" fill="#C2CAD2" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22">that turn AI-assisted drafts into dependable products.</text>

    <g transform="translate(0 444)" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="700">
      <text x="0" y="0" fill="#F4C95D">EDGE CASES</text>
      <text x="128" y="0" fill="#626D78">/</text>
      <text x="152" y="0" fill="#60D6C2">FALLBACKS</text>
      <text x="268" y="0" fill="#626D78">/</text>
      <text x="292" y="0" fill="#E68A73">TEST STATES</text>
      <text x="424" y="0" fill="#626D78">/</text>
      <text x="448" y="0" fill="#9FB7FF">RELEASE PATHS</text>
    </g>

    <text x="0" y="532" fill="#7F8994" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15">React / TypeScript / Product UI / Developer Tooling</text>
  </g>

  <rect x="814" y="52" width="2" height="536" fill="#2B3239"/>

  <g transform="translate(858 52)" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="0" y="0" fill="#9DA7B2" font-size="16" font-weight="700">PRODUCTION TRACE</text>
    <text x="0" y="28" fill="#66717C" font-size="14">from plausible draft to dependable release</text>

    <path d="M12 92V410" stroke="#3B444D" stroke-width="2"/>

    <g transform="translate(0 82)">
      <circle cx="12" cy="10" r="10" fill="#F4C95D"/>
      <text x="38" y="8" fill="#F5F7F8" font-size="18" font-weight="700">01 / DRAFT</text>
      <text x="38" y="32" fill="#8B96A1" font-size="14">AI-accelerated exploration</text>
    </g>

    <g transform="translate(0 174)">
      <circle cx="12" cy="10" r="10" fill="#9FB7FF"/>
      <text x="38" y="8" fill="#F5F7F8" font-size="18" font-weight="700">02 / CONSTRAIN</text>
      <text x="38" y="32" fill="#8B96A1" font-size="14">contracts, browser behavior, edge cases</text>
    </g>

    <g transform="translate(0 266)">
      <circle cx="12" cy="10" r="10" fill="#E68A73"/>
      <text x="38" y="8" fill="#F5F7F8" font-size="18" font-weight="700">03 / VERIFY</text>
      <text x="38" y="32" fill="#8B96A1" font-size="14">test states, schemas, deterministic fallback</text>
    </g>

    <g transform="translate(0 358)">
      <circle cx="12" cy="10" r="10" fill="#60D6C2"/>
      <text x="38" y="8" fill="#F5F7F8" font-size="18" font-weight="700">04 / SHIP</text>
      <text x="38" y="32" fill="#8B96A1" font-size="14">release, observe, refactor, reuse</text>
    </g>

    <g transform="translate(0 472)">
      <rect width="118" height="3" fill="#F4C95D"/>
      <rect x="118" width="232" height="3" fill="#60D6C2"/>
      <text x="0" y="30" fill="#F4C95D" font-size="13" font-weight="700">AI SPEED</text>
      <text x="212" y="30" fill="#60D6C2" font-size="13" font-weight="700">ENGINEERING JUDGMENT</text>
    </g>
  </g>
</svg>
