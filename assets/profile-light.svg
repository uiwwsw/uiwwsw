    <text x="193" y="435" fill="#424A53" font-size="14" font-weight="700">ABSTRACT</text>
    <text x="294" y="435" fill="#8C959F" font-size="14">→</text>
    <text x="326" y="435" fill="#424A53" font-size="14" font-weight="700">BUILD</text>
