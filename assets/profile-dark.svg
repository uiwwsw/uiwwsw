    <text x="68" y="342" fill="#9DA7B2" font-size="22">Simple for users. Changeable for teams.</text>

    <rect x="840" y="116" width="1" height="236" fill="#30363D"/>

    <text x="884" y="154" fill="#FF6B57" font-size="14" font-weight="700">01</text>
